[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jensenshannondivergence"
version = "0.1.0"

description = "Jensen-Shannon divergence estimation for tabular data using discriminator-based methods"

readme = "README.md"

requires-python = ">=3.9"

license = { file = "LICENSE" }

authors = [
  { name = "Alba Garrido López", email = "alba.garrido.lopez@upm.es" }
]

urls = {
  "Source" = "https://github.com/AlbaGarridoLopezz/jensenshannondivergence"
}

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "scikit-optimize>=0.10",
  "colorama>=0.4",
  "packaging>=24"
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
]

keywords = [
  "jensen-shannon",
  "divergence",
  "statistics",
  "machine-learning",
  "synthetic-data"
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
ml = ["xgboost>=2.0"]
tabular = [
  "syndat>=0.13",
  "synthcity>=0.2.12",
  "tabpfn>=6.4.1"
]
viz = ["matplotlib>=3.8"]

dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.0"
]

all = [
  "torch>=2.2",
  "xgboost>=2.0",
  "syndat>=0.13",
  "synthcity>=0.2.12",
  "tabpfn>=6.4.1",
  "matplotlib>=3.8"
]

[project.scripts]
jsd-estimate = "jensenshannondivergence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]